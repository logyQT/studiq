# CI-only overlay for the non-stack Supabase CLI (SUPABASE_EXPERIMENTAL_STACK=0).
#
# The app's activation/recovery flow links to `/auth/callback?token_hash=...`,
# not GoTrue's default `{{ .ConfirmationURL }}` verify URL. Stack projects in
# CLI 3.0.0 cannot serve `content_path` templates, so the committed
# `supabase/config.toml` leaves them out and the QA job appends this file before
# `supabase start`. Hosted projects configure the same templates in the
# dashboard; integration/e2e do not depend on the e-mail body.
#
# Keep the subjects in step with `supabase/templates/*.html`.

[auth.email.template.recovery]
subject = "StudiQ - Password Reset"
content_path = "./supabase/templates/auth.email.template.recovery.html"

[auth.email.template.confirmation]
subject = "StudiQ - Confirm Your Email"
content_path = "./supabase/templates/auth.email.template.confirmation.html"
