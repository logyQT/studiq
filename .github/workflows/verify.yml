name: verify

# Manual + nightly + every PR. `workflow_dispatch` only works once this file is
# on the default branch; PRs run it directly.
#
# No workflow-level `paths:` filter on purpose: a workflow skipped by a path
# filter never reports its jobs, so the checks `main` requires would sit in
# "Expected — waiting for status to be reported" and a docs-only PR could never
# merge. The work is still scoped per job by the `scope` job below: a job skipped
# with `if:` reports success and satisfies a required check.
#
# The e2e matrix is the exception, because `main` requires the *matrix-expanded*
# names (`e2e (chromium)`, `e2e (firefox)`): a job skipped by `if:` never expands
# its matrix, so those names are never created at all and stay pending forever.
# That job therefore always runs and gates its steps on `scope` instead — a
# skipped leg then reports success under its required name in a few seconds.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Pinned: `bun lint` is canary-only, and canaries are published to npm but not
# as GitHub releases (setup-bun resolves releases and 404s on them). Keep in
# step with scripts/check-bun-version.ts (>= 1.4.4).
env:
  BUN_VERSION: 1.4.4-canary.20261027.1
  # `supabase/config.toml` reads every configurable value through `env()`; an
  # unset numeric variable makes the config fail to parse, so the whole job
  # graph shares one explicit CI stack identity. Each job owns its own native
  # stack (ports are assigned by the CLI per runner).
  SUPABASE_PROJECT_ID: studiq-ci
  # CI runs the native runtime: the experimental stack backend is required, the
  # CLI assigns ports per runner, and no Docker daemon is used.
  SUPABASE_EXPERIMENTAL_STACK: '1'
  SUPABASE_RUNTIME: native
  # QA specs that assert branded auth e-mail links skip in stack mode; the rest
  # of the suite runs normally.
  STUDIQ_STACK_MODE: '1'

jobs:
  # Cheapest first, in the order a failure is cheapest to explain: lint, types.
  # This job is a merge gate, not a fan-out gate: the test jobs below wait only
  # on `scope` (7 s), because a runner that boots Supabase, builds and installs
  # browsers does not need to sit idle for 28 s behind lint. The trade-off is
  # deliberate — a lint failure no longer stops the test jobs before they start,
  # so it also burns their runners.
  # A QA-suite PR only touches qa/** (plus, occasionally, __tests__ helpers).
  # The app, its unit/integration tests and the e2e matrix cannot change there,
  # so they are skipped; `checks` (lint/typecheck, which does cover qa specs) and
  # the `qa-suite` job still run. A docs-only PR (docs/**, any *.md outside
  # qa/cases/) is treated the same way and then some: no app code and no spec can
  # change, so `checks` is the only job that does any real work (the e2e legs
  # still report, but as no-ops — see the note on top — and the QA suite starts no
  # shard at all).
  # Schedule/dispatch runs everything.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.diff.outputs.app }}
      qa_shards: ${{ steps.diff.outputs.qa_shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone has no merge base, and the three-dot diff needs one.
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "app=true" >> "$GITHUB_OUTPUT"
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "changed files:"; echo "$changed"
            # Here-string, not `echo | grep -q`: under `pipefail`, grep exits on
            # the first match and the writer gets SIGPIPE (141), which flipped
            # `app` to false and skipped the unit/integration/e2e jobs.
            if ! grep -qvE '^(qa/|__tests__/|docs/)|\.md$' <<< "$changed"; then
              echo "app=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          python3 - "${BASE_REF:-}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          # Balanced on measured per-area test time, sampled from the per-spec
          # durations of run 41569902675 (all four shards, no retries):
          # STU 762 s, EDU 711, MGR 499, AUT 171, SEC 152, NFR 100, ONB 99,
          # BIL 87, LIM 63, PUB 48 — 2692 s of tests, so the ideal shard is
          # 673 s (~168 s of wall clock at QA_WORKERS=4).
          #
          # The old grouping (stu-lim-nfr / edu / aut-sec-pub-bil / mgr-onb)
          # measured 244 / 185 / 165 / 136 s — a 108 s spread.
          #
          # STU (762) and EDU (711) are above the ideal on their own, and an
          # area is not split across shards (`scope` narrows a PR to the shards
          # whose areas it touches), so `stu` and `edu` stay single-area and the
          # other eight divide as MGR+SEC+BIL / AUT+NFR+ONB+PUB+LIM. Measured in
          # run 41569902675: 199 / 195 / 195 / 131 s.
          #
          # Equalising the sums instead (MGR+PUB+LIM 610 vs AUT+SEC+NFR+ONB+BIL
          # 609) was tried in run 41570914752 and measured worse at the only
          # number that gates the pipeline: the five-area shard took 215 s and
          # used 2.83 of 4 workers, where this layout's shards use 3.7-3.8.
          # Packing more areas into one runner costs worker efficiency faster
          # than the extra balance buys, so this grouping keeps the lower max.
          #
          # ~199 s is the floor: STU alone is 28% of the suite. Going below it
          # needs a split area (a PR touching STU would then run two shards) or
          # a fifth runner — the operator's call, not a default.
          shards = [
              {"name": "edu", "paths": "__tests__/qa/EDU", "areas": ["EDU"]},
              {"name": "stu", "paths": "__tests__/qa/STU", "areas": ["STU"]},
              {
                  "name": "mgr-sec-bil",
                  "paths": "__tests__/qa/MGR __tests__/qa/SEC __tests__/qa/BIL",
                  "areas": ["MGR", "SEC", "BIL"],
              },
              {
                  "name": "aut-nfr-onb-pub-lim",
                  "paths": (
                      "__tests__/qa/AUT __tests__/qa/NFR __tests__/qa/ONB "
                      "__tests__/qa/PUB __tests__/qa/LIM"
                  ),
                  "areas": ["AUT", "NFR", "ONB", "PUB", "LIM"],
              },
          ]

          # No base ref = nightly schedule / manual dispatch: run the whole suite.
          base = sys.argv[1] if len(sys.argv) > 1 else ""
          if not base:
              selected = shards
          else:
              changed = subprocess.run(
                  ["git", "diff", "--name-only", f"origin/{base}...HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.split()
              # Shared QA files, anything outside qa/, or a QA PR that touches no
              # spec at all can change every area -> run all shards. Only a PR
              # that pins a *known* area narrows (see `area_of` below).
              # `__tests__/` is deliberately absent: it holds both the specs
              # (usable for narrowing) and the helpers the suite imports
              # (`__tests__/helpers/tenant-seed`, `__tests__/e2e/fixtures/ids`),
              # so the narrowing decision is per file instead of per prefix.
              shared = (
                  "qa/fixtures/", "qa/playwright.qa.config.ts",
                  "scripts/qa-tenant.ts", "scripts/qa-issue.ts",
                  ".github/workflows/verify.yml", "package.json", "bun.lock",
                  "apps/", "packages/", "supabase/",
              )
              # A docs-only PR (markdown, no case catalogue entry) cannot reach a
              # spec, a fixture or the app, so no shard has anything to prove:
              # start none rather than four runners for ~6 min each. A case
              # catalogue entry (qa/cases/<AREA>-*.md) is markdown too, but it
              # does drive a shard's fixtures — it is excluded here and mapped to
              # its area below. Anything else that touches no spec still runs
              # every shard (see `not touched` below), because that is a QA PR
              # changing shared behaviour we cannot attribute to one area.
              docs_only = bool(changed) and all(
                  f.endswith(".md") and not f.startswith("qa/cases/") for f in changed
              )

              area_names = {a for s in shards for a in s["areas"]}

              def area_of(f):
                  """The single area a changed file pins, or None if it pins none."""
                  if f.startswith("__tests__/qa/profiles/") and f.endswith(".json"):
                      return f.rsplit("/", 1)[-1].split("-")[0]
                  if f.startswith("qa/cases/") and f.endswith(".md"):
                      return f.rsplit("/", 1)[-1].split("-")[0]
                  parts = f.split("/")
                  if len(parts) > 3 and parts[:2] == ["__tests__", "qa"]:
                      return parts[2]
                  return None

              # A case PR adds a spec under __tests__/qa/<AREA>/ and/or a profile at
              # __tests__/qa/profiles/<CASE>.json; both pin the case's area, so a
              # normal case PR runs exactly one shard.
              areas = {a for a in map(area_of, changed) if a}
              # Anything else under __tests__/ (helpers, e2e fixtures, setup,
              # mocks, KNOWN-FAILURES.json), an area the shard list does not know
              # yet, or a shared file still means "run everything": a silent
              # under-run is worse than four runners.
              force_all = (
                  any(f.startswith(shared) for f in changed)
                  or any(a not in area_names for a in areas)
                  or any(
                      f.startswith("__tests__/") and area_of(f) is None for f in changed
                  )
              )
              touched = [s for s in shards if set(s["areas"]) & areas]
              if docs_only:
                  selected = []
              else:
                  selected = shards if force_all or not touched else touched
          print("qa_shards=" + json.dumps(selected))
          PY

  # The required check that no test job waits on any more: a lint/type failure
  # still blocks the merge, it just no longer holds the runners back first.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Bun (pinned canary)
        run: npm install -g bun@${{ env.BUN_VERSION }}
      # The only job that *writes* the bun cache: every other job restores it,
      # and this workflow never runs on a push to main, so the nightly/dispatch
      # run is what refreshes it. One writer means no concurrent reserve races
      # for the same key.
      #
      # A main run restores the exact key but never the fallback: `restore-keys`
      # would seed the directory with the previous generation's tarballs and the
      # save would carry every superseded package version into the new cache.
      # PR jobs may fall back, because they never write.
      - name: Restore bun install cache (exact)
        id: bun-cache-main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
      - name: Restore bun install cache (fallback)
        id: bun-cache-pr
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-24.04-
      - run: bun install --frozen-lockfile
      - name: Save bun install cache
        # A cache write is an optimisation: never let it fail the gate.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && steps.bun-cache-main.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache-main.outputs.cache-primary-key }}
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck:all

  unit:
    needs: [scope]
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - name: Restore bun install cache
        id: bun-cache-unit
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-24.04-
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    needs: [scope]
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - name: Restore bun install cache
        id: bun-cache-integration
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-24.04-
      - run: bun install --frozen-lockfile
      - name: Start Supabase
        env:
          APP_URL: http://localhost:3000
        run: bunx supabase stack start --runtime native --eager -x studio,functions,analytics,realtime,pooler
      - name: Write root .env
        # vitest's loadEnv() reads the repo root; integration imports the route
        # handlers directly, so no app server is needed.
        run: |
          status=$(bunx supabase stack status --output-format json)
          API_URL=$(jq -r .env.API_URL <<<"$status")
          ANON_KEY=$(jq -r .env.ANON_KEY <<<"$status")
          SERVICE_ROLE_KEY=$(jq -r .env.SERVICE_ROLE_KEY <<<"$status")
          DB_URL=$(jq -r .env.DB_URL <<<"$status")
          MAILPIT_URL=$(jq -r .env.MAILPIT_URL <<<"$status")
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "OTEL_SDK_DISABLED=true"
          } > .env
      - name: Integration tests
        # Serial: several suites write the same seeded orgs, and `fileParallelism`
        # made seats/members flake. 525 tests in ~55 s is fine.
        run: bunx vitest run __tests__/integration --no-file-parallelism
      - name: Stop Supabase
        if: always()
        run: bunx supabase stop || true

  # The QA suite has its own runner (qa/playwright.qa.config.ts, shared app on
  # :3010, one worker). The root config only sees __tests__/e2e, so without this
  # job `__tests__/qa/**` would never run in CI.
  qa-suite:
    needs: [scope]
    if: needs.scope.outputs.qa_shards != '[]'
    # Sharded by area, one runner per shard. The suite is one long serial job
    # (~12 min at 140 specs, growing), so splitting is what buys wall-clock time
    # now — not more workers: the runner is 4 vCPU and raising QA_WORKERS only
    # starves the app, Supabase and Chromium against each other.
    #
    # A PR runs only the shards whose areas it touches (see `scope`); a shared QA
    # file, an app/packages change, or the nightly schedule runs all of them.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.qa_shards) }}
    name: qa-suite (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      QA_APP_URL: http://localhost:3010
      # Every test owns its tenant, so CI can run four at a time on a 4-vCPU
      # runner. Locally the same variable stays unset (workers: 1).
      QA_WORKERS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Start Supabase (native)
        env:
          # `supabase/config.toml` resolves `auth.site_url` from `env(APP_URL)`;
          # without it the QA e-mails carry relative callback links.
          APP_URL: http://localhost:3010
        run: bunx supabase stack start --runtime native --eager -x studio,functions,analytics,realtime,pooler

      - name: Write env files
        # The app reads apps/web/.env, but the QA seeder and the specs that seed
        # their own tenant are plain Bun processes: without these vars in the job
        # environment they fall back to the shared-VM localhost:54421 and fail
        # with `fetch failed`. Export them to $GITHUB_ENV as well.
        run: |
          status=$(bunx supabase stack status --output-format json)
          API_URL=$(jq -r .env.API_URL <<<"$status")
          ANON_KEY=$(jq -r .env.ANON_KEY <<<"$status")
          SERVICE_ROLE_KEY=$(jq -r .env.SERVICE_ROLE_KEY <<<"$status")
          DB_URL=$(jq -r .env.DB_URL <<<"$status")
          MAILPIT_URL=$(jq -r .env.MAILPIT_URL <<<"$status")
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            # Lets the seeder write auth users straight into Postgres (one
            # statement, one bcrypt for the whole batch) instead of one GoTrue
            # admin call per account. Optional: without a direct URL (e.g. a
            # hosted project) it falls back to the Admin API.
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3010"
            echo "OTEL_SDK_DISABLED=true"
          } > apps/web/.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "OTEL_SDK_DISABLED=true"
            echo "QA_APP_URL=http://localhost:3010"
          } >> "$GITHUB_ENV"

      # Same split as the e2e legs after #988: main restores only its exact key
      # (Playwright never deletes superseded revisions, so a fallback would keep
      # forwarding old browsers), PRs may fall back because they never write.
      #
      # `--only-shell` below installs the headless shell only, which is a
      # different cache *content* from the e2e legs' `chromium`: own key, so the
      # two cannot overwrite each other the way `playwright-Linux-<lock>` used
      # to (whichever leg saved first owned the entry).
      - name: Restore Playwright browsers (exact)
        id: pw-cache-main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-chromium-shell-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers (fallback)
        id: pw-cache-pr
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-chromium-shell-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-ubuntu-24.04-chromium-shell-

      - name: Install Chromium
        # QA runs headless, and since Playwright 1.49 a headless launch drives
        # `chromium_headless_shell`, not the full browser: ~275 MB instead of
        # ~675 MB for both, which is also what the cache entry above carries.
        # `--with-deps` still installs the system libraries.
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Save Playwright browsers
        # A cache write is an optimisation: never let it fail the job. One
        # writer, like the bun cache — every shard restores, `edu` saves.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && matrix.shard.name == 'edu' && steps.pw-cache-main.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache-main.outputs.cache-primary-key }}

      # `next build` is 36-46 s per job and six jobs build the same tree (four QA
      # shards, two e2e legs). The `.next/cache` a build leaves behind is
      # Turbopack's content-addressed module cache: restoring it turns most of
      # that into cache hits (measured locally: 17.2 s cold -> 7.5 s with a
      # restored cache, and 7.5 s after changing one source file). Only
      # `.next/cache` is cached — never the whole `.next` — so no server chunk
      # from another commit can be served.
      #
      # Key on the lockfile, not the commit: a per-sha key would add a ~250 MB
      # entry to the 10 GB budget on every nightly (main is the only writer)
      # and evict the bun/browser caches #988 just right-sized. Entries are
      # content-addressed, so a cache from an older commit still hits for every
      # unchanged module, and a lockfile bump (renovate) rotates it naturally.
      - name: Restore Next build cache (exact)
        id: next-cache-main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-ubuntu-24.04-${{ hashFiles('bun.lock') }}
      - name: Restore Next build cache (fallback)
        id: next-cache-pr
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            next-ubuntu-24.04-

      - name: Build and start the shared app
        run: |
          bun run build
          (cd apps/web && bunx next start -p 3010 > /tmp/qa-app.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3010/login && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3010/login

      - name: Save Next build cache
        # One writer, like the bun and browser caches: every building job
        # restores, the `edu` shard writes.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && matrix.shard.name == 'edu' && steps.next-cache-main.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache-main.outputs.cache-primary-key }}

      - name: Seed this shard's tenants
        # Same shape as `scripts/e2e-seed.ts`: one process, one run suffix, before
        # Playwright starts. Seeding inside the run would stall the app and the
        # 4-worker suite against it; every spec still gets its own tenant because
        # the suffix is folded into each case's key.
        #
        # Only the areas this shard runs: a PR shard carries ~50 of the 170 cases,
        # so seeding all of them is wall-clock spent on tenants nobody opens.
        # `SUPABASE_DB_URL` (exported above) also lets the seeder write auth users with one
        # SQL statement instead of one GoTrue admin call per account — GoTrue
        # bcrypts every password it creates, which was most of the old 32 s.
        run: bun scripts/qa-tenant.ts --all --areas "${{ join(matrix.shard.areas, ',') }}" --run "ci${{ github.run_id }}"

      - name: Run the QA suite
        run: bunx playwright test -c qa/playwright.qa.config.ts --reporter=line ${{ matrix.shard.paths }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-suite-report-${{ matrix.shard.name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop || true

  # One leg per browser so a red platform re-runs alone. Each leg owns its
  # tenant set (keys include the project) and its own Supabase instance.
  #
  # No job-level `if:` on purpose: `main` requires `e2e (chromium)` and
  # `e2e (firefox)`, and those names only exist once the matrix expands. Gating
  # the job instead made a docs-only PR unmergeable — the legs were reported as a
  # single skipped `e2e` check and the required names never appeared.
  # `scope` still decides the work: when no app code changed every step below is
  # skipped and the leg reports success immediately.
  e2e:
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # ubuntu-latest is 4 vCPU; one project saturates at ~4 workers.
      E2E_WORKERS: '4'
      # The workflow owns both, in explicit steps below: it builds/starts the app
      # and seeds this leg's tenants, so Playwright must not repeat either.
      E2E_SKIP_WEB_WS: '1'
      E2E_SKIP_SEED: '1'
    steps:
      - name: No app code changed
        if: needs.scope.outputs.app != 'true'
        run: echo "scope says no app code changed — ${{ matrix.project }} leg not needed"
      - uses: actions/checkout@v7
        if: needs.scope.outputs.app == 'true'
      - uses: actions/setup-node@v7
        if: needs.scope.outputs.app == 'true'
        with:
          node-version: 22
      - run: npm install -g bun@${{ env.BUN_VERSION }}
        if: needs.scope.outputs.app == 'true'
      - name: Restore bun install cache
        id: bun-cache-e2e
        if: needs.scope.outputs.app == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-24.04-
      - run: bun install --frozen-lockfile
        if: needs.scope.outputs.app == 'true'

      - name: Start Supabase
        if: needs.scope.outputs.app == 'true'
        env:
          APP_URL: http://localhost:3000
        # None of these services is reachable from the app, and each `-x` entry
        # skips its native artifact/start cost too:
        #   studio + postgres-meta  Studio/tooling only — the API and the QA
        #                           specs talk to PostgREST, not pg-meta
        #   realtime                no client: nothing in apps/ or packages/
        #                           calls `.channel()` (the `supabase_realtime`
        #                           publication is a plain Postgres object and
        #                           still exists without the container)
        #   functions/analytics/pooler  unused
        # `storage` stays: QA `EDU-ASG-08` uploads and the integration storage
        # suites need it.
        run: bunx supabase stack start --runtime native --eager -x studio,functions,analytics,realtime,pooler

      - name: Write env files
        if: needs.scope.outputs.app == 'true'
        # Local Supabase keys are deterministic, so nothing here is a secret.
        run: |
          status=$(bunx supabase stack status --output-format json)
          API_URL=$(jq -r .env.API_URL <<<"$status")
          ANON_KEY=$(jq -r .env.ANON_KEY <<<"$status")
          SERVICE_ROLE_KEY=$(jq -r .env.SERVICE_ROLE_KEY <<<"$status")
          DB_URL=$(jq -r .env.DB_URL <<<"$status")
          MAILPIT_URL=$(jq -r .env.MAILPIT_URL <<<"$status")
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "OTEL_SDK_DISABLED=true"
          } > apps/web/.env

      # Same reason as the bun cache: Playwright never deletes previous browser
      # revisions, so a main run restores only its exact key and saves a set
      # that contains just the current one. PRs may fall back.
      - name: Restore Playwright browsers (exact)
        id: pw-cache-main
        if: needs.scope.outputs.app == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ matrix.project }}-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers (fallback)
        id: pw-cache-pr
        if: needs.scope.outputs.app == 'true' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ matrix.project }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-ubuntu-24.04-${{ matrix.project }}-

      - name: Install browsers
        run: bunx playwright install --with-deps ${{ matrix.project }}
        if: matrix.project != 'admin-api' && needs.scope.outputs.app == 'true'

      - name: Save Playwright browsers
        # A cache write is an optimisation: never let it fail the job.
        continue-on-error: true
        if: matrix.project != 'admin-api' && needs.scope.outputs.app == 'true' && github.ref == 'refs/heads/main' && steps.pw-cache-main.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache-main.outputs.cache-primary-key }}

      # Restore-only: the QA shard writes this cache (one writer, like the bun
      # and browser caches). Same content as the QA build even though the two
      # shape `NEXT_PUBLIC_SITE_URL` differently — Turbopack treats the env as an
      # input of every module it inlines into, so a restore never leaks the
      # other job's origin (verified: a build over a cache made with a different
      # site URL contains none of the old value).
      - name: Restore Next build cache (exact)
        if: needs.scope.outputs.app == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-ubuntu-24.04-${{ hashFiles('bun.lock') }}
      - name: Restore Next build cache (fallback)
        if: needs.scope.outputs.app == 'true' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            next-ubuntu-24.04-

      # Same shape as `qa-suite`: the workflow starts the app and seeds, and
      # Playwright only drives the browser. Before this, the build hid inside
      # Playwright's `webServer` (~40 s of the "Run Playwright" step) and the
      # seeding inside `globalSetup`, so neither was visible as a step.
      - name: Build and start the app
        if: needs.scope.outputs.app == 'true'
        run: |
          bun run build
          (cd apps/web && bunx next start -p 3000 > /tmp/e2e-app.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/login

      - name: Seed this leg's tenants
        if: needs.scope.outputs.app == 'true'
        # One tenant per test of this project. `--reset` keeps a re-run from
        # inheriting the previous run's decks and quiz attempts — specs mutate
        # their own tenant and spend its plan limits.
        run: bun scripts/e2e-seed.ts --reset --project ${{ matrix.project }}

      - name: Run Playwright (${{ matrix.project }})
        if: needs.scope.outputs.app == 'true'
        run: bunx playwright test --project=${{ matrix.project }} --shuffle --reporter=line

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always() && needs.scope.outputs.app == 'true'
        run: bunx supabase stop || true

  # admin-api only needs the admin app; the web server is skipped so this leg
  # costs seconds rather than a second Next build.
  e2e-admin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_INCLUDE_ADMIN: '1'
      E2E_SKIP_WEB_WS: '1'
      # The admin spec signs its own requests and never reads a tenant, so
      # seeding 240 orgs here is waste — and the seeder needs apps/web/.env,
      # which this leg deliberately does not write.
      E2E_SKIP_SEED: '1'
      E2E_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g bun@${{ env.BUN_VERSION }}
      - name: Restore bun install cache
        id: bun-cache-admin
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-24.04-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-ubuntu-24.04-
      - run: bun install --frozen-lockfile
      - name: Start Supabase
        env:
          APP_URL: http://localhost:3000
        run: bunx supabase stack start --runtime native --eager -x studio,functions,analytics,realtime,pooler
      - name: Write admin env
        run: |
          status=$(bunx supabase stack status --output-format json)
          API_URL=$(jq -r .env.API_URL <<<"$status")
          ANON_KEY=$(jq -r .env.ANON_KEY <<<"$status")
          SERVICE_ROLE_KEY=$(jq -r .env.SERVICE_ROLE_KEY <<<"$status")
          DB_URL=$(jq -r .env.DB_URL <<<"$status")
          MAILPIT_URL=$(jq -r .env.MAILPIT_URL <<<"$status")
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } > apps/admin/.env
      - name: Install browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright (admin-api)
        run: bunx playwright test --project=admin-api --shuffle --reporter=line
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-admin
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: bunx supabase stop || true
