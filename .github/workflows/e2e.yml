name: e2e

# Manual + nightly + PRs that touch the suite or the app. `workflow_dispatch`
# only works once this file is on the default branch; PRs run it directly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - '__tests__/**'
      - 'scripts/e2e-seed.ts'
      - 'playwright.config.ts'
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest first, in the order a failure is cheapest to explain: formatting,
  # lint, types. Everything else waits on this.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `bun lint` is canary-only, and canaries are published to npm but not as
      # GitHub releases (setup-bun resolves releases and 404s on them).
      - name: Install Bun (pinned canary)
        run: npm install -g bun@1.4.4-canary.20261027.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck:all

  unit:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `bun lint` is canary-only, and canaries are published to npm but not as
      # GitHub releases (setup-bun resolves releases and 404s on them).
      - name: Install Bun (pinned canary)
        run: npm install -g bun@1.4.4-canary.20261027.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `bun lint` is canary-only, and canaries are published to npm but not as
      # GitHub releases (setup-bun resolves releases and 404s on them).
      - name: Install Bun (pinned canary)
        run: npm install -g bun@1.4.4-canary.20261027.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Start Supabase
        run: bunx supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - name: Write root .env
        # vitest's loadEnv() reads the repo root; integration imports the route
        # handlers directly, so no app server is needed.
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "OTEL_SDK_DISABLED=true"
          } > .env
      - run: bun run test:integration
      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup || true

  e2e:
    # ubuntu-latest = 4 vCPU / 16 GB / ~14 GB free disk. The suite needs
    # Supabase (~5 GB of images with studio/logflare/edge excluded), node_modules
    # (1.5 GB), the Next build (~1 GB after dropping .next/cache) and two
    # browsers (~0.5 GB) — it fits, but only just.
    needs: [checks, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # The config falls back to the CPU count on CI (4 here). Override only if
      # the runner is bigger.
      E2E_WORKERS: '4'
      # admin-api is a nightly/manual leg: three assertions don't justify
      # building the admin app on every PR (its gate logic is unit-tested).
      E2E_INCLUDE_ADMIN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `bun lint` is canary-only, and canaries are published to npm but not as
      # GitHub releases (setup-bun resolves releases and 404s on them).
      - name: Install Bun (pinned canary)
        run: npm install -g bun@1.4.4-canary.20261027.1

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase
        # studio/logflare/vector/edge-runtime are not used by the app; skipping
        # them saves ~4 GB of pulls and a couple of minutes.
        run: bunx supabase start -x studio,imgproxy,logflare,vector,edge-runtime

      - name: Write env files
        # Local Supabase keys are deterministic, so nothing here is a secret.
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "OTEL_SDK_DISABLED=true"
          } > apps/web/.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > apps/admin/.env

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox

      # Playwright's webServer builds and starts the app (bun run build &&
      # bun run start), so there is no separate build step to keep in sync.
      - name: Run Playwright
        run: bunx playwright test --shuffle --reporter=line

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup || true
