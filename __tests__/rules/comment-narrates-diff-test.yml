id: comment-narrates-diff
valid:
  # Rationale that happens to start with a past-tense verb.
  - |
    // Removed by #595: forwarded so the schema rejects it
  - |
    // removed from the list only after validation
  - |
    // This was handled in 2023 by the legacy importer
  # A multi-line block comment is not the single-line shape this rule targets.
  - |
    /**
     * now uses the new API
     */
invalid:
  - |
    // removed the old path
  - |
    // deleted the legacy helper
  - |
    // was handled upstream
  - |
    // previously named Foo
  - |
    // now uses the new API
  - |
    // no longer reads the cookie
  # Single-line block comments carry the same shape.
  - |
    /* now uses the new API */
  - |
    /* removed the old path */
