pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,mdx,yml,yaml,toml,html}'
      run: bun fmt --staged
      stage_fixed: true
    # Lint exactly the scope `bun run lint` covers (apps/*/src, packages, __tests__).
    # `scripts/` and root configs are typechecked, not linted, so a bare `--staged`
    # run would fail the hook on findings CI never sees. Passing the matched file
    # list keeps the hook and CI on the same scope — see AGENTS.md → Commands.
    fix:
      glob:
        # `**/` needs at least one directory in lefthook's glob, so each root
        # needs the direct-children pattern too.
        - '{apps/web/src,apps/admin/src,packages,__tests__}/**/*.{ts,tsx,js,jsx,mjs,cjs}'
        - '{apps/web/src,apps/admin/src,packages,__tests__}/*.{ts,tsx,js,jsx,mjs,cjs}'
      run: bun lint --no-script --fix {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck:all

pre-push:
  parallel: false
  commands:
    merge-conflict:
      run: |
        git fetch origin main --quiet 2>/dev/null || true
        if ! git merge-tree --write-tree origin/main HEAD >/dev/null 2>&1; then
          echo ''
          echo '  X Push blocked -- merge conflicts with main detected.'
          echo ''
          echo '  Rebase or merge main and resolve conflicts before pushing:'
          echo ''
          echo '    git fetch origin main'
          echo '    git merge origin/main    # resolve conflicts, commit'
          echo '    # -- or --'
          echo '    git rebase origin/main    # resolve conflicts, continue'
          echo ''
          exit 1
        fi
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck:all
    test:
      run: bun test:unit
