pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,css}'
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck

pre-push:
  parallel: false
  commands:
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun test:unit