pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,css}'
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck

pre-push:
  parallel: false
  commands:
    merge-conflict:
      run: |
        git fetch origin main --quiet 2>/dev/null || true
        if ! git merge-tree --write-tree origin/main HEAD >/dev/null 2>&1; then
          echo ""
          echo "  ✘ Push blocked — merge conflicts with main detected."
          echo ""
          echo "  Rebase or merge main and resolve conflicts before pushing:"
          echo ""
          echo "    git fetch origin main"
          echo "    git merge origin/main    # resolve conflicts, commit"
          echo "    # — or —"
          echo "    git rebase origin/main    # resolve conflicts, continue"
          echo ""
          exit 1
        fi
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun test:unit