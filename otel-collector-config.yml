receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # ── Traces → Tempo (OTLP gRPC) ─────────────────────────────
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ── Metrics → Prometheus scrape endpoint ───────────────────
  # Prometheus scrapes otel-collector:8889; the `namespace` prefixes every
  # metric with `studiq_` (e.g. studiq_http_server_request_total).
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: studiq
    # Expose resource attributes (service.name, deployment.environment) as
    # metric labels so parallel QA agents can be filtered by service_name
    # instead of needing a namespace per agent.
    resource_to_telemetry_conversion:
      enabled: true

  # ── Logs → Loki (OTLP HTTP) ────────────────────────────────
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
