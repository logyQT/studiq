# ONE machine-wide observability stack, not one per checkout/worktree.
# Start this file ONLY from the primary checkout so every worktree shares one
# stack. Running it from a worktree would mutate/conflict with the same project
# rather than create an isolated one; the fixed name prevents a second copy
# under the directory name.
#
# Host ports are in the 7000s so they cannot collide with the env tool's
# 3000-range app-port leases. Container ports stay at upstream defaults.
name: studiq-observability

services:
  # Single OTLP intake — the app only ever talks to this service.
  # Fans out to Tempo (traces), Prometheus (metrics) and Loki (logs).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    restart: unless-stopped
    command: ['--config', '/etc/otelcol/config.yml']
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml
    ports:
      - '7317:4317' # OTLP gRPC (host 7000s to avoid env app-port leases)
      - '7318:4318' # OTLP HTTP (app endpoint)
      - '7889:8889' # Prometheus exporter scrape endpoint
    depends_on:
      - tempo
      - loki

  # Sole trace backend — Grafana-native, queried with TraceQL.
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo_data:/var/tempo
    ports:
      - '7200:3200' # Tempo HTTP API (Grafana datasource)

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    ports:
      - '7100:3100' # Loki HTTP API (Grafana datasource + OTLP ingestion)

  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    ports:
      - '7090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - '7001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
