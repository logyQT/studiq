# Bun-native toolchain.
#
# Linting and formatting are Bun built-ins (`bun lint`, `bun fmt`).
# Requires Bun >= 1.4.4 — see `engines.bun` in package.json and
# `scripts/check-bun-version.ts`.

# Supply-chain gate, half one of two: Bun refuses to *resolve* a package
# version published less than this many seconds ago, for direct and transitive
# dependencies alike. 604800 = 7 days.
#
# This is what covers `bun add`, `bun update` and a human running `bun install`
# against an edited package.json — the paths where a malicious publish is most
# likely to be picked up. Dependabot's `cooldown` (.github/dependabot.yml) only
# filters the dependency it proposes and cannot see transitives, so it is not a
# substitute. Half two is `scripts/check-lockfile-age.ts`, which checks the
# lockfile diff on every PR (CI) and therefore also covers whatever the hosted
# updater resolves.
#
# Only *new* resolution is gated: versions already in bun.lock are left alone,
# and `bun install --frozen-lockfile` (CI) never resolves at all. Exempt a
# package with `minimumReleaseAgeExcludes = ["pkg", "pkg@1.2.3"]` if a
# deliberate early pin is ever needed.
[install]
minimumReleaseAge = 604800

[fmt]
printWidth = 100
singleQuote = true
# Formatting covers Markdown, YAML, TOML and HTML too (the one-time first pass over
# those types is listed in .git-blame-ignore-revs).
#
# `*.jsonc` stays out of scope: `bun fmt` rewrites JSONC with trailing commas, which is
# valid JSONC but risks breaking readers that strip comments and then call `JSON.parse`
# (e.g. the OpenCode config loader).
#
# `.agents/skills/` stays out of scope: it is vendored third-party skill content whose
# `SKILL.md` files are checksummed in skills-lock.json. See .git-blame-ignore-revs for
# the one-time pass over the rest of the repo.
#
# `eslint-suppressions.json` is generated by `bun lint`, so keep it out of the formatter.
ignorePatterns = ["**/*.jsonc", ".agents/skills/**", "eslint-suppressions.json"]

[lint]
# Scope is passed by the scripts (`bun run lint` covers apps/*/src, packages and
# __tests__; each workspace lints its own src/), matching the old Biome includes.
# bun lint itself already skips node_modules and .gitignore'd paths.
#
# Type-aware rules use Bun's built-in type checker (`bun check`) — no
# `typescript` package needed. Each file is checked with its nearest tsconfig.
typeAware = true
# The baseline is empty and every warning has been fixed; a new warning now
# fails the run just like an error.
maxWarnings = 0

[lint.categories]
# Bun's defaults already cover correctness (ESLint + typescript-eslint
# recommended); `suspicious` is the one extra tier we adopted.
#
# `perf` and `style` are deliberately **not** adopted. Measured on 2026-11-03:
# `perf` adds ~1,700 findings (only 3 auto-fixable, mostly `no-await-in-loop`
# for intentional sequential I/O) and `style` adds ~66,000 (mostly `one-var`,
# `sort-keys`, `no-magic-numbers`). See docs/audits/173-bun-strictness-premise.md
# before proposing either again.
suspicious = "warn"

[lint.rules]
# --- Keep our stricter-than-Bun choices -------------------------------
# Biome had these as errors; Bun ships them as warnings or off.
"@typescript-eslint/no-unused-vars" = "error"
"@typescript-eslint/no-explicit-any" = "error"
"react-hooks/exhaustive-deps" = "error"
# Bun also ships `exhaustive-effect-dependencies`, a duplicate of the rule above
# that fires on the same dependency arrays. Keep the ESLint-compatible name and
# turn the duplicate off here instead of suppressing it inline at six call sites.
"react-hooks/exhaustive-effect-dependencies" = "off"
"react/no-danger" = "error"
"oxc/no-barrel-file" = ["error", { threshold = 0 }]

# --- Biome parity rules kept off for now ------------------------------
"no-shadow-restricted-names" = "off"
"no-empty" = "off"
"array-callback-return" = "off" # biome: suspicious/useIterableCallbackReturn off
"typescript/prefer-optional-chain" = "warn"

# --- Weak in our old config, Bun's rule is stricter -------------------
# Biome had every one of these off.
"jsx-a11y/alt-text" = "error"
"jsx-a11y/anchor-has-content" = "error"
"jsx-a11y/anchor-is-valid" = "error"
"jsx-a11y/aria-activedescendant-has-tabindex" = "error"
"jsx-a11y/aria-props" = "error"
"jsx-a11y/aria-proptypes" = "error"
"jsx-a11y/aria-role" = "error"
"jsx-a11y/aria-unsupported-elements" = "error"
"jsx-a11y/autocomplete-valid" = "error"
"jsx-a11y/click-events-have-key-events" = "error"
"jsx-a11y/control-has-associated-label" = "error"
"jsx-a11y/heading-has-content" = "error"
"jsx-a11y/html-has-lang" = "error"
"jsx-a11y/iframe-has-title" = "error"
"jsx-a11y/img-redundant-alt" = "error"
"jsx-a11y/interactive-supports-focus" = "error"
"jsx-a11y/label-has-associated-control" = "error"
"jsx-a11y/lang" = "error"
"jsx-a11y/media-has-caption" = "error"
"jsx-a11y/mouse-events-have-key-events" = "error"
"jsx-a11y/no-access-key" = "error"
"jsx-a11y/no-aria-hidden-on-focusable" = "error"
"jsx-a11y/no-autofocus" = "error"
"jsx-a11y/no-distracting-elements" = "error"
"jsx-a11y/no-interactive-element-to-noninteractive-role" = "error"
"jsx-a11y/no-noninteractive-element-interactions" = "error"
"jsx-a11y/no-noninteractive-element-to-interactive-role" = "error"
"jsx-a11y/no-noninteractive-tabindex" = "error"
"jsx-a11y/no-redundant-roles" = "error"
"jsx-a11y/no-static-element-interactions" = "error"
"jsx-a11y/prefer-tag-over-role" = "error"
"jsx-a11y/role-has-required-aria-props" = "error"
"jsx-a11y/role-supports-aria-props" = "error"
"jsx-a11y/scope" = "error"
"jsx-a11y/tabindex-no-positive" = "error"
"react/button-has-type" = "error"

# --- Import paths -----------------------------------------------------
# Same intent as the old Biome `noRestrictedImports` rule: app code and tests
# must use `@/`, `@admin/`, `@studiq/*` or `#test/` aliases, never relative
# specifiers. `packages/**`, `scripts/**` and root configs are excluded via
# overrides below. `scripts/check-import-paths.ts` remains the authoritative
# guard — it also covers `require()` and cross-package boundaries.
"no-restricted-imports" = ["error", {
  patterns = [{
    group = ["./**", "../**"],
    message = "Relative import. Use an alias: '@/…', '@admin/…', '@studiq/…' or '#test/…' (AGENTS.md → Import Paths).",
  }],
}]

# A package must use relative imports internally.
[[lint.overrides]]
files = ["packages/**"]
rules = { "no-restricted-imports" = "off" }

# Scripts have no `@/` alias (it resolves to the consuming app's src) and use
# intra-script relative imports (`seed.ts` -> `./config`). The import-path guard
# (scripts/check-import-paths.ts) deliberately covers apps and tests only.
[[lint.overrides]]
files = ["scripts/**"]
rules = { "no-restricted-imports" = "off" }

# Package entrypoints are the one allowed barrel file.
[[lint.overrides]]
files = ["packages/*/src/index.ts"]
rules = { "oxc/no-barrel-file" = "off" }

# Test helpers named `use*` are not React hooks.
# Tests also pass method references to `expect(...)` and `vi.mocked(...)` by design;
# unbound-method is a false positive for that Vitest idiom.
[[lint.overrides]]
files = ["__tests__/**"]
rules = { "react-hooks/rules-of-hooks" = "off", "@typescript-eslint/unbound-method" = "off" }
